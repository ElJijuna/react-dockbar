name: CI

# Pushes to main/master are covered by the Release workflow.
on:
  pull_request:
  push:
    branches-ignore: [main, master]

jobs:
  build:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both majors in peerDependencies. The lockfile pins 19; 18 is swapped in per job.
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Use React ${{ matrix.react }}
        if: matrix.react != '19'
        run: >
          npm install --no-save
          react@^${{ matrix.react }} react-dom@^${{ matrix.react }}
          @types/react@^${{ matrix.react }} @types/react-dom@^${{ matrix.react }}

      - run: npm run typecheck
      - run: npm test -- --coverage

      # Version-independent checks only need to run once.
      - if: matrix.react == '19'
        run: npm run lint
      - if: matrix.react == '19'
        run: npm run build
      # Without the directive as the first statement, importing the dock from a React Server
      # Component (e.g. Next.js App Router) fails.
      - name: Check the "use client" directive
        if: matrix.react == '19'
        run: |
          for file in dist/react-dockbar.js dist/react-dockbar.cjs; do
            head -c 13 "$file" | grep -qx '"use client";' || { echo "::error file=$file::missing \"use client\" directive"; exit 1; }
          done
      - if: matrix.react == '19'
        run: npm run build:storybook
